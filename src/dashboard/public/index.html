<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HANDLER</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12151a;
    --panel-2: #171b21;
    --line: #232830;
    --ink: #e6e9ee;
    --dim: #8b95a3;
    --dimmer: #5b6472;
    --amber: #f0b429;
    --green: #3ecf8e;
    --red: #ff6b6b;
    --blue: #5aa9e6;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  h1 { margin: 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--amber); }
  .tag { color: var(--dim); font-size: 12px; }
  .pill {
    font-size: 11px; padding: 2px 8px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--dim);
  }
  .pill.ok { color: var(--green); border-color: rgba(62,207,142,.35); }
  .pill.bad { color: var(--red); border-color: rgba(255,107,107,.35); }
  main { padding: 20px 24px 60px; display: grid; gap: 18px; max-width: 1180px; }

  .approval {
    border: 1px solid var(--amber); border-radius: 10px; background: #191408;
    padding: 16px 18px;
  }
  .approval h2 {
    margin: 0 0 4px; font-size: 12px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--amber);
  }
  .approval .who { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .args {
    background: #0d0f13; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin: 10px 0 14px; white-space: pre-wrap;
    word-break: break-word; font-size: 12.5px; color: #cfd6e0;
  }
  .args .k { color: var(--blue); }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13px; padding: 8px 18px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
    cursor: pointer; transition: transform .06s ease, background .12s ease;
  }
  button:hover { background: #1e232b; }
  button:active { transform: translateY(1px); }
  button.allow { border-color: rgba(62,207,142,.5); color: var(--green); }
  button.deny { border-color: rgba(255,107,107,.45); color: var(--red); }

  .run {
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    overflow: hidden;
  }
  .run > .top {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
  }
  .run .name { font-weight: 600; }
  .run .id { color: var(--dimmer); font-size: 12px; }
  .spacer { flex: 1; }
  .st { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .st.running { color: var(--blue); }
  .st.succeeded { color: var(--green); }
  .st.failed, .st.killed { color: var(--red); }
  .st.stalled { color: var(--amber); }

  .body { display: grid; grid-template-columns: 220px 1fr; gap: 18px; padding: 16px; }
  @media (max-width: 720px) { .body { grid-template-columns: 1fr; } }
  .nums { font-size: 12.5px; color: var(--dim); display: grid; gap: 3px; align-content: start; }
  .nums b { color: var(--ink); font-weight: 600; }
  .cmd {
    grid-column: 1 / -1; color: var(--dimmer); font-size: 11.5px;
    word-break: break-all; border-top: 1px solid var(--line); padding-top: 10px;
  }
  svg { width: 100%; height: 92px; display: block; }
  .legend { font-size: 11px; color: var(--dimmer); margin-top: 2px; }
  .legend i { display: inline-block; width: 9px; height: 2px; vertical-align: middle; margin-right: 5px; }

  .finding {
    grid-column: 1 / -1; border: 1px solid var(--line); border-left: 2px solid var(--green);
    border-radius: 8px; background: var(--panel-2); padding: 12px 14px; font-size: 13px;
  }
  .finding.open { border-left-color: var(--amber); }
  .finding .lab {
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--dimmer); margin-bottom: 3px;
  }
  .finding p { margin: 0 0 9px; }
  .finding .ev { color: var(--dim); font-size: 12px; white-space: pre-wrap; }
  a { color: var(--blue); }
  .empty { color: var(--dimmer); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Handler</h1>
  <span class="tag">the agent that watches your training runs</span>
  <span class="spacer"></span>
  <span class="pill" id="tf">harness …</span>
  <span class="pill" id="clock"></span>
</header>
<main id="main"><div class="empty">loading…</div></main>

<script>
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function sparkline(curve) {
  const pts = curve.filter(p => typeof p.loss === 'number');
  if (pts.length < 2) return '<div class="legend">no metrics yet</div>';
  const vals = pts.flatMap(p => [p.loss, typeof p.val === 'number' ? p.val : p.loss]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  const W = 100, H = 100;
  const x = i => (i / (pts.length - 1)) * W;
  const y = v => H - ((v - lo) / span) * H;
  const path = key => pts.map((p, i) => {
    const v = key === 'loss' ? p.loss : (typeof p.val === 'number' ? p.val : p.loss);
    return (i ? 'L' : 'M') + x(i).toFixed(2) + ' ' + y(v).toFixed(2);
  }).join(' ');
  // NaN steps drop out of `pts`, so a gap in the line is itself information.
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <path d="${path('val')}" fill="none" stroke="#f0b429" stroke-width="1.1" vector-effect="non-scaling-stroke" opacity=".85"/>
      <path d="${path('loss')}" fill="none" stroke="#5aa9e6" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="legend"><i style="background:#5aa9e6"></i>train
      <i style="background:#f0b429;margin-left:12px"></i>validation
      &nbsp;·&nbsp; ${lo.toFixed(3)} – ${hi.toFixed(3)}</div>`;
}

function prettyArgs(args) {
  if (args == null) return '';
  let obj = args;
  if (typeof args === 'string') { try { obj = JSON.parse(args); } catch { return esc(args); } }
  return Object.entries(obj)
    .map(([k, v]) => `<span class="k">${esc(k)}</span>: ${esc(typeof v === 'object' ? JSON.stringify(v) : v)}`)
    .join('\n');
}

function approvalCard(run, item) {
  return `<div class="approval">
    <h2>Approval required · ${esc(item.name)}</h2>
    <div class="who">HANDLER is holding on <b>${esc(run.name)}</b> (${esc(run.id)}) until you answer.</div>
    <div class="args">${prettyArgs(item.arguments)}</div>
    <div class="buttons">
      <button class="allow" onclick="decide('${run.id}','${item.threadId}','${item.toolCallId}',true)">Approve</button>
      <button class="deny" onclick="decide('${run.id}','${item.threadId}','${item.toolCallId}',false)">Reject</button>
      ${run.sessionUrl ? `<a href="${esc(run.sessionUrl)}" target="_blank"><button>Open in harness</button></a>` : ''}
    </div>
  </div>`;
}

function findingCard(inc) {
  if (!inc) return '';
  const open = !inc.rootCause;
  return `<div class="finding ${open ? 'open' : ''}">
    <div class="lab">${esc(inc.detector)}${inc.confidence ? ' · confidence ' + esc(inc.confidence) : ''}</div>
    <p>${esc(inc.summary)}</p>
    ${inc.rootCause ? `<div class="lab">Root cause</div><p>${esc(inc.rootCause)}</p>` : '<p class="ev">Agent is working…</p>'}
    ${inc.recommendation ? `<div class="lab">Recommendation</div><p>${esc(inc.recommendation)}</p>` : ''}
    ${inc.agentEvidence ? `<div class="lab">Evidence</div><div class="ev">${esc(inc.agentEvidence)}</div>` : ''}
  </div>`;
}

function runCard(run) {
  const loss = run.lastLoss === null ? 'NaN' : Number(run.lastLoss).toFixed(4);
  return `<div class="run">
    <div class="top">
      <span class="name">${esc(run.name)}</span>
      <span class="id">${esc(run.id)}</span>
      <span class="spacer"></span>
      ${run.alive ? '<span class="pill ok">alive</span>' : ''}
      <span class="st ${esc(run.status)}">${esc(run.status)}</span>
    </div>
    <div class="body">
      <div class="nums">
        <div>step <b>${run.lastStep}</b></div>
        <div>train loss <b>${esc(loss)}</b></div>
        <div>val loss <b>${run.lastVal === null || run.lastVal === undefined ? '—' : Number(run.lastVal).toFixed(4)}</b></div>
        ${run.budgetUsd ? `<div>budget <b>$${run.budgetUsd}</b></div>` : ''}
        ${run.exitCode !== null && run.exitCode !== undefined ? `<div>exit <b>${run.exitCode}</b></div>` : ''}
        ${run.sessionUrl ? `<div><a href="${esc(run.sessionUrl)}" target="_blank">session ↗</a></div>` : ''}
      </div>
      <div>${sparkline(run.curve)}</div>
      ${findingCard(run.incident)}
      <div class="cmd">${esc(run.command)}</div>
    </div>
  </div>`;
}

async function decide(runId, threadId, toolCallId, allow) {
  let reason = '';
  if (!allow) reason = prompt('Why are you rejecting this? The agent sees it.') ?? 'rejected by operator';
  await fetch('/api/decide', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ runId, threadId, toolCallId, allow, reason }),
  });
  refresh();
}

async function refresh() {
  let state;
  try {
    state = await (await fetch('/api/state')).json();
  } catch {
    document.getElementById('tf').className = 'pill bad';
    document.getElementById('tf').textContent = 'console offline';
    return;
  }
  const tf = document.getElementById('tf');
  tf.className = 'pill ' + (state.trueforgeUp ? 'ok' : 'bad');
  tf.textContent = state.trueforgeUp ? 'harness up' : 'harness down';
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();

  const approvals = state.runs.flatMap(r => (r.approvals || []).map(a => approvalCard(r, a)));
  const runs = state.runs.map(runCard);
  document.getElementById('main').innerHTML =
    (approvals.join('') || '') +
    (runs.join('') || '<div class="empty">No runs yet — try <b>npm run handler -- demo nan-loss</b></div>');
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
